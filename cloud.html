<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supabase 云端保存</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="cloud.css"></head><body><main class="card"><h1>Supabase 云端保存</h1><p>保存和恢复线索、每日进度及任务时长。每个账号保留一份最新备份；上传会覆盖云端备份。</p><form id="login"><label>项目 URL<input id="url" type="url" required placeholder="https://your-project.supabase.co"></label><label>Publishable / anon key<input id="key" type="password" required autocomplete="off"></label><label>账号邮箱<input id="email" type="email" required autocomplete="username"></label><label>密码<input id="password" type="password" required autocomplete="current-password"></label><button class="btn">登录并保存配置</button></form><p>请先执行项目目录中的 supabase.sql，并在 Supabase Authentication 中创建邮箱账号。</p><div class="button-row"><button class="btn" id="upload" disabled>上传本机数据</button><button class="btn secondary" id="restore" disabled>从云端恢复</button><button class="btn secondary" id="logout">退出登录</button></div><p id="status" role="status">尚未登录</p></main><script type="module" src="cloud.js"></script></body></html>
